<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-blue-100 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-lg shadow-xl p-8 space-y-8">
        <div class="text-center">
            <i class="fas fa-university text-5xl text-blue-600"></i>
            <h2 class="mt-4 text-3xl font-bold text-gray-900">
                Welcome to the Bank
            </h2>
            <p class="mt-2 text-sm text-gray-600">
                Manager Login
            </p>
        </div>

        <!-- The form action points to /login and the method is POST -->
        <form th:action="@{/login}" method="post" class="space-y-6">
            <div>
                <label for="account_no" class="text-sm font-medium text-gray-700">Account no</label>
                <!--
                    ★★★ THE FIX IS HERE ★★★
                    The 'name' attribute MUST be "accountNumber" to match the controller.
                -->
                <input type="text" id="account_no" name="accountNumber" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div>
                <label for="password" class="text-sm font-medium text-gray-700">Password</label>
                <!-- This field also needs the correct name attribute -->
                <input type="password" id="password" name="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div class="flex items-center justify-between space-x-4">
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Login
                </button>
                <a href="/add-account" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-gray-600 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">
                    Signup
                </a>
            </div>
        </form>
    </div>

</body>
</html>
