<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-green-100 min-h-screen">

    <!-- Header -->
    <header class="bg-gray-800 text-white p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <i class="fas fa-university text-2xl"></i>
            <h1 class="text-2xl font-bold">MCB Bank</h1>
        </div>
        <nav class="space-x-4">
            <a href="/accounts" class="hover:text-green-300">Home</a>
            <a href="/add-account" class="hover:text-green-300">Add New Account</a>
            <a href="#" class="hover:text-green-300 opacity-50 cursor-not-allowed">Feedback</a>
        </nav>
        <div class="flex items-center space-x-3">
            <span class="font-semibold">Welcome Manager</span>
            <a href="/" class="bg-red-600 hover:bg-red-700 p-2 rounded-full text-white">
                <i class="fas fa-sign-out-alt"></i>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-8 flex items-center justify-center">
        <div class="max-w-2xl w-full bg-white rounded-lg shadow-xl overflow-hidden">
            <div class="p-6 border-b">
                <h2 class="text-2xl font-bold text-center text-gray-800">Create New Account</h2>
            </div>
            <form th:action="@{/add-account}" method="post" class="p-8 space-y-6">
                <!-- Holder Name -->
                <div>
                    <label for="holderName" class="block text-sm font-medium text-gray-700">Holder Name</label>
                    <input type="text" id="holderName" name="holderName" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500">
                </div>
                <!-- Account Number -->
                <div>
                    <label for="accountNumber" class="block text-sm font-medium text-gray-700">Account Number</label>
                    <input type="text" id="accountNumber" name="accountNumber" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500">
                </div>
                <!-- Branch Name -->
                <div>
                    <label for="branchName" class="block text-sm font-medium text-gray-700">Branch Name</label>
                    <input type="text" id="branchName" name="branchName" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500">
                </div>
                 <!-- Current Balance -->
                <div>
                    <label for="currentBalance" class="block text-sm font-medium text-gray-700">Opening Balance</label>
                    <input type="number" step="0.01" id="currentBalance" name="currentBalance" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500">
                </div>
                 <!-- Account Type -->
                <div>
                    <label for="accountType" class="block text-sm font-medium text-gray-700">Account Type</label>
                    <select id="accountType" name="accountType" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500">
                        <option value="saving">Saving</option>
                        <option value="current">Current</option>
                    </select>
                </div>
                <!-- Contact -->
                <div>
                    <label for="contact" class="block text-sm font-medium text-gray-700">Contact</label>
                    <input type="text" id="contact" name="contact" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500">
                </div>
                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" name="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-green-500 focus:border-green-500">
                </div>
                <!-- Submit Button -->
                <div class="flex justify-end">
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition duration-300 ease-in-out">
                        Create Account
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
