<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Accounts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-green-100 min-h-screen">

    <!-- Header -->
    <header class="bg-gray-800 text-white p-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-2">
            <i class="fas fa-university text-2xl"></i>
            <h1 class="text-2xl font-bold">MCB Bank</h1>
        </div>
        <nav class="space-x-4">
            <!-- Fixed the links to point to the correct URLs -->
            <a href="/accounts" class="hover:text-green-300">Home</a>
            <a href="/add-account" class="hover:text-green-300">Add New Account</a>
            <!-- Styled Feedback as a placeholder -->
            <a href="#" class="hover:text-green-300 opacity-50 cursor-not-allowed">Feedback</a>
        </nav>
        <div class="flex items-center space-x-3">
            <span class="font-semibold">Welcome Manager</span>
            <a href="/" class="bg-red-600 hover:bg-red-700 p-2 rounded-full text-white">
                <i class="fas fa-sign-out-alt"></i>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-8">
        <div class="max-w-7xl mx-auto bg-white rounded-lg shadow-xl overflow-hidden">
            <div class="p-6 border-b">
                <h2 class="text-2xl font-bold text-center text-gray-800">All Accounts</h2>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-200">
                        <tr>
                            <th class="py-3 px-4 text-left font-semibold text-gray-600">#</th>
                            <th class="py-3 px-4 text-left font-semibold text-gray-600">Holder Name</th>
                            <th class="py-3 px-4 text-left font-semibold text-gray-600">Account No.</th>
                            <th class="py-3 px-4 text-left font-semibold text-gray-600">Branch Name</th>
                            <th class="py-3 px-4 text-left font-semibold text-gray-600">Current Balance</th>
                            <th class="py-3 px-4 text-left font-semibold text-gray-600">Account Type</th>
                            <th class="py-3 px-4 text-left font-semibold text-gray-600">Contact</th>
                            <th class="py-3 px-4 text-center font-semibold text-gray-600">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-700">
                        <tr th:each="account, iterStat : ${accounts}" class="border-b hover:bg-gray-50">
                            <td class="py-3 px-4" th:text="${iterStat.count}">1</td>
                            <td class="py-3 px-4" th:text="${account.holderName}">King Bob</td>
                            <td class="py-3 px-4" th:text="${account.accountNumber}">1005469</td>
                            <td class="py-3 px-4" th:text="${account.branchName}">Bank</td>
                            <td class="py-3 px-4" th:text="'Rs.' + ${#numbers.formatDecimal(account.currentBalance, 1, 'COMMA', 2, 'POINT')}">Rs.9944</td>
                            <td class="py-3 px-4 capitalize" th:text="${account.accountType}">Current</td>
                            <td class="py-3 px-4" th:text="${account.contact}">03356910260</td>
                            <td class="py-3 px-4 flex justify-center items-center space-x-2">
                                <!-- View Button (Link) -->
                                <a th:href="@{/accounts/view/{id}(id=${account.id})}" class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600 text-sm">View</a>
                                <!-- Send Notice Button (Placeholder) -->
                                <a href="#" class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 text-sm opacity-50 cursor-not-allowed">Send Notice</a>
                                <!-- Delete Button (Form) -->
                                <form th:action="@{/accounts/delete/{id}(id=${account.id})}" method="post" onsubmit=" confirm('Are you sure you want to delete this account?');">
                                    <button type="submit" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 text-sm">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="p-4 bg-gray-50 text-center text-gray-500 font-semibold">
                MCB Bank
            </div>
        </div>
    </main>

</body>
</html>
